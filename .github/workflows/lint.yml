name: lint

# Self-contained ruff lint (public repo can't call the private org reusable
# workflow — the prior caller was silently failing at startup). Uses the
# repo's ruff.toml.

on: [pull_request]

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
